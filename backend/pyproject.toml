# 声明后端项目元数据、依赖和检查工具配置。
[project]
name = "asomforge"
version = "0.1.0"
description = "Local Agent configuration and collaboration assistant"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.130",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20",
  "pyyaml>=6,<7",
  "mcp>=1.12,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25", "ruff>=0.11", "psutil>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
